; ============================================================
; WAAMINI — PHP Performance Settings (user.ini)
; PHP reads this file automatically for CGI/FastCGI modes.
; For mod_php (XAMPP default), .htaccess php_value handles this.
; ============================================================

; ---- OPcache (biggest speed win — caches compiled PHP in RAM) ----
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=4000
opcache.revalidate_freq=60
opcache.validate_timestamps=1
; opcache.fast_shutdown was removed; keep unset for stability on PHP 8+

; ---- Realpath cache (speeds up every require/include/file_exists) ----
realpath_cache_size=4096k
realpath_cache_ttl=600

; ---- Session ----
session.cookie_httponly=1
session.use_strict_mode=1
session.gc_maxlifetime=3600

; ---- Output ----
output_buffering=4096

; ---- Security ----
expose_php=Off
display_errors=Off
log_errors=On

; ---- Database safety (avoid runaway concurrency on shared hosting) ----
; Keep these conservative for Hostinger-scale PHP-FPM; adjust per plan.
max_execution_time=60
max_input_time=60
